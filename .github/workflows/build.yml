name: Export Space 3D Cross-Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Import Project
        run: godot --headless --path . --import
      - name: Export Windows EXE
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/Space3D.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Space3D-Windows
          path: build/windows/Space3D.exe

  export-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Configure Android SDK & Debug Keystore
        run: |
          mkdir -p ~/.android ~/.config/godot
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import Project
        run: godot --headless --path . --import
      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/Space3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Space3D-Android-APK
          path: build/android/Space3D.apk

  export-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Import Project
        run: godot --headless --path . --import
      - name: Export iOS Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --path . --export-release "iOS" build/ios/Space3D.ipa
      - name: Build Unsigned IPA
        run: |
          xcodebuild -project build/ios/Space3D.xcodeproj \
            -scheme Space3D \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build
          mkdir -p build/ios/Payload
          cp -R build/ios/DerivedData/Build/Products/Release-iphoneos/Space3D.app build/ios/Payload/
          cd build/ios && zip -qry Space3D-Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Space3D-iOS-IPA
          path: build/ios/Space3D-Unsigned.ipa
